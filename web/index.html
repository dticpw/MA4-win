<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MA4</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=ma4-panels-1">
<link rel="icon" type="image/svg+xml" sizes="any" href="/ma4-icon.svg?v=ma4-panels-1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span>
</div>

<header class="topbar glass">
  <button id="home" class="brand" type="button" title="回到总览">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d7cff"/><stop offset="1" stop-color="#b16cff"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#lg)"/>
      <rect x="12" y="16" width="16" height="32" rx="5" fill="#fff" opacity=".55"/>
      <rect x="32" y="16" width="20" height="14" rx="5" fill="#fff"/>
      <rect x="32" y="34" width="20" height="14" rx="5" fill="#fff" opacity=".8"/>
    </svg>
    <span class="brand-name">MA4</span>
  </button>
  <nav class="stats" aria-label="筛选会话">
    <button class="stat waiting" data-filter="waiting" type="button" title="等你审批或回答；点一下只看这些">
      <b id="count-waiting">0</b><span>等你</span>
    </button>
    <button class="stat running" data-filter="running" type="button" title="正在运行；点一下只看这些">
      <b id="count-running">0</b><span>运行中</span>
    </button>
    <button class="stat unread" data-filter="unread" type="button" title="有新回复；点一下只看这些">
      <b id="count-unread">0</b><span>新回复</span>
    </button>
  </nav>
  <div class="top-right">
    <button id="notify-toggle" class="ghost small" type="button">开启桌面提醒</button>
    <span id="daemon" class="daemon" title="Codex 共享后台">共享后台</span>
    <button id="theme-toggle" class="icon-button" type="button" title="切换外观"></button>
    <div class="clock"><b id="clock-time">--:--</b><span id="clock-date"></span></div>
  </div>
</header>

<main class="layout">
  <aside class="sessions glass">
    <div class="sessions-head">
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        <input id="search" aria-label="搜索会话或目录" type="search" placeholder="搜索会话 / 目录" autocomplete="off">
      </div>
      <button id="new-thread" class="primary small" type="button">＋ 新建</button>
    </div>
    <div id="filter-bar" class="filter-bar" hidden>
      <span id="filter-label"></span><button id="filter-clear" class="link" type="button">显示全部</button>
    </div>
    <ul id="thread-list" class="thread-list"></ul>
  </aside>

  <section class="chat glass" id="chat">
    <div id="empty" class="welcome">
      <div class="welcome-inner">
        <p class="welcome-kicker" id="welcome-date"></p>
        <h2 id="welcome-greeting">你好</h2>
        <p id="welcome-summary" class="welcome-summary"></p>
        <div id="welcome-attention" class="welcome-section"></div>
        <div id="welcome-recent" class="welcome-section"></div>
        <button id="welcome-new" class="primary" type="button">＋ 新建会话</button>
      </div>
    </div>
    <div id="conversation" class="conversation" hidden>
      <div class="chat-head">
        <div id="chat-avatar" class="avatar big"></div>
        <div class="chat-title">
          <button id="rename" class="title-button" type="button" title="点击改名"></button>
          <div id="chat-meta" class="chat-meta"></div>
        </div>
        <div class="chat-actions">
          <button id="pin" class="ghost small" type="button">置顶</button>
          <button id="terminal" class="ghost small" type="button" title="通过共享后台在终端继续此会话">在终端打开</button>
          <button id="interrupt" class="danger small" type="button" hidden>中断</button>
        </div>
      </div>
      <div id="messages" class="messages">
        <button id="older" class="ghost small older" type="button" hidden>加载更早的记录</button>
        <div id="turns"></div>
        <div id="live-status" class="live-status" hidden></div>
      </div>
      <form id="composer" class="composer">
        <ul id="palette" class="palette glass" hidden></ul>
        <div class="composer-box">
          <textarea id="input" aria-label="发送消息" rows="2" placeholder="发给这个会话…"></textarea>
          <button id="send" class="primary send" type="submit">发送</button>
        </div>
        <div class="composer-row">
          <span id="composer-hint" class="hint"></span>
          <span class="keys"><kbd>/</kbd> 命令 <kbd>$</kbd> Skill <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        </div>
      </form>
    </div>
  </section>

  <aside class="side">
    <section class="card glass attention" id="approvals-card" hidden>
      <h3>待审批</h3>
      <div id="approvals"></div>
    </section>
    <section class="card glass">
      <h3>额度</h3>
      <div id="quota" class="quota"></div>
    </section>
    <section class="card glass">
      <h3>站点</h3>
      <ul id="health" class="health"></ul>
      <div id="links" class="links"></div>
    </section>
  </aside>
</main>

<dialog id="new-dialog" class="glass">
  <form method="dialog" id="new-form">
    <h3>新建会话</h3>
    <label>工作目录
      <input id="new-cwd" list="cwd-options" required placeholder="E:\PG\项目名">
    </label>
    <datalist id="cwd-options"></datalist>
    <label>第一条消息（可选）
      <textarea id="new-text" rows="4"></textarea>
    </label>
    <p id="new-error" class="error"></p>
    <div class="dialog-row">
      <button value="cancel" class="ghost" type="submit" formnovalidate>取消</button>
      <button id="new-submit" class="primary" type="button">创建</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
